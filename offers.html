<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Our Offers — AI Adoption Co</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>

body { min-height: 100vh; }

.page-center {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 40px 120px;
}

.offers-container {
  width: 100%;
  max-width: 860px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ── CARDS ── */
[data-offer="1"] { --oc: #60a5fa; }
[data-offer="2"] { --oc: #2563eb; }
[data-offer="3"] { --oc: #1e3a8a; }

.cards-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.offer-card {
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 3px;
  padding: 32px 20px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  cursor: pointer;
  user-select: none;
  box-shadow: 6px 6px 0 var(--oc);
  transition: transform 0.18s ease, box-shadow 0.18s ease,
              background 0.2s ease, border-color 0.18s ease;
}
.offer-card:hover {
  border-color: var(--oc);
  transform: translate(-2px, -2px);
  box-shadow: 8px 8px 0 var(--oc);
}
.offer-card.active {
  background: var(--oc);
  border-color: transparent;
  transform: translate(-2px, -2px);
  box-shadow: 8px 8px 0 rgba(0,0,0,0.18);
}

.card-icon {
  width: 44px;
  height: 44px;
  margin-bottom: 18px;
  color: var(--oc);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.2s;
}
.card-icon svg { width: 100%; height: 100%; }
.offer-card.active .card-icon { color: rgba(255,255,255,0.75); }

.card-num {
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -0.04em;
  color: var(--oc);
  line-height: 1;
  margin-bottom: 8px;
  transition: color 0.2s;
}
.offer-card.active .card-num { color: rgba(255,255,255,0.65); }

.card-name {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: #0f0e0c;
  margin-bottom: 8px;
  transition: color 0.2s;
}
.offer-card.active .card-name { color: #fff; }

.card-desc {
  font-size: 12.5px;
  font-weight: 300;
  color: #8a8278;
  line-height: 1.6;
  transition: color 0.2s;
}
.offer-card.active .card-desc { color: rgba(255,255,255,0.72); }

/* ── PANEL ── */
.expand-panel {
  display: none;
}
.expand-panel.visible {
  display: block;
  animation: panelDown 0.26s ease;
}
@keyframes panelDown {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.panel-box {
  background: #f5f7fa;
  border: 1px solid #e8edf2;
  border-radius: 8px;
  padding: 40px 44px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.panel-text {
  font-size: 14px;
  font-weight: 300;
  color: #5a5248;
  line-height: 1.78;
  max-width: 600px;
}

.panel-chips {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}

.level-chip {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.03em;
  padding: 4px 11px;
  border-radius: 999px;
  border: 1px solid;
  text-decoration: none;
  transition: opacity 0.15s;
  white-space: nowrap;
}
.level-chip:hover { opacity: 0.72; }

.panel-link {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: 999px;
  border: 1.5px solid;
  align-self: flex-start;
  transition: background 0.18s, color 0.18s;
}

/* ── IDLE PROMPT ── */
.offers-idle {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  transition: opacity 0.2s;
  padding-bottom: 16px;
}
.offers-idle.hidden { opacity: 0; pointer-events: none; }
.offers-idle-arrow {
  font-size: 22px;
  color: #9a9080;
  display: inline-block;
}
.offers-idle-text {
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #9a9080;
}

/* ── MOBILE ── */
@media (max-width: 680px) {
  .page-center { padding: 60px 20px 100px; }
  .cards-row { grid-template-columns: 1fr; }
  .panel-box { padding: 28px 24px; }
}

</style>
</head>
<body>

<div class="page-center">
  <div class="offers-container">

    <div class="offers-idle" id="offers-idle">
      <span class="offers-idle-arrow">↓</span>
      <span class="offers-idle-text">Pick an offer</span>
    </div>

    <div class="cards-row">

      <div class="offer-card" data-offer="1" onclick="selectOffer(1)">
        <div class="card-icon">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polyline points="6,42 18,42 18,28 30,28 30,14 42,14"
              stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="card-num">01</div>
        <div class="card-name">Basic Training</div>
        <div class="card-desc">Half-day on-site for the whole team.</div>
      </div>

      <div class="offer-card" data-offer="2" onclick="selectOffer(2)">
        <div class="card-icon">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="24,4 44,24 24,44 4,24"
              stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
            <rect x="15" y="15" width="18" height="18"
              stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="card-num">02</div>
        <div class="card-name">Advanced Training</div>
        <div class="card-desc">Deeper work for the people ready for more.</div>
      </div>

      <div class="offer-card" data-offer="3" onclick="selectOffer(3)">
        <div class="card-icon">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M24,4 L27,21 L44,24 L27,27 L24,44 L21,27 L4,24 L21,21 Z"
              stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="card-num">03</div>
        <div class="card-name">Assessment</div>
        <div class="card-desc">A clear read on where your organisation stands.</div>
      </div>

    </div>

    <div class="expand-panel" id="expand-panel">
      <div class="panel-box">
        <p class="panel-text" id="panel-text"></p>
        <div class="panel-chips" id="panel-chips"></div>
        <a class="panel-link" id="panel-link" href="#">Find out more →</a>
      </div>
    </div>

  </div>
</div>

<div class="nav-dot" id="nav-dot">
  <div class="nav-dot-menu" id="nav-menu">
    <a href="index.html" class="nav-dot-item">Home</a>
    <a href="levels.html" class="nav-dot-item">The Levels</a>
    <a href="mailto:j4kepilgrim@gmail.com" class="nav-dot-item">Get in touch</a>
  </div>
  <button class="nav-dot-btn" onclick="toggleNavDot()" aria-label="Menu"></button>
</div>

<script>
const offers = {
  1: {
    text: "A half-day on-site session for the whole team. Hands-on from the start — people work through real examples from your business. They leave with a framework they can use on any task, and you get a written read on where the team landed.",
    chips: [
      { label: "0 · Passenger", bg: "#eff6ff", color: "#60a5fa", border: "#bfdbfe" },
      { label: "1 · Driver",    bg: "#dbeafe", color: "#3b82f6", border: "#93c5fd" },
      { label: "2 · Builder",   bg: "#bfdbfe", color: "#2563eb", border: "#60a5fa" }
    ],
    href: "training.html",
    lc: "#60a5fa"
  },
  2: {
    text: "A deeper session for the people on your team who are ready to go further. Smaller group, more demanding work. Each person builds something real during the session and presents it back. They leave with the skills to keep going without us in the room.",
    chips: [
      { label: "3 · Connector",    bg: "#dbeafe", color: "#2563eb",  border: "#93c5fd" },
      { label: "4 · Architect",    bg: "#bfdbfe", color: "#1d4ed8",  border: "#60a5fa" },
      { label: "5 · Orchestrator", bg: "#1e3a8a", color: "#e0eaff",  border: "#1e3a8a" }
    ],
    href: "advanced-training.html",
    lc: "#2563eb"
  },
  3: {
    text: "A clear read on where your organisation actually stands with AI and where to focus next. Built from your data — a whole-org survey, interviews across functions, and a ranked backlog of the workflows worth changing. The output is a board-ready presentation with specific recommendations.",
    chips: null,
    href: "assessment.html",
    lc: "#1e3a8a"
  }
};

let current = null;

function selectOffer(num) {
  const panel = document.getElementById('expand-panel');

  if (current === num) {
    document.querySelector(`[data-offer="${num}"]`).classList.remove('active');
    panel.classList.remove('visible');
    document.getElementById('offers-idle').classList.remove('hidden');
    current = null;
    return;
  }

  document.querySelectorAll('.offer-card').forEach(c => c.classList.remove('active'));
  document.querySelector(`[data-offer="${num}"]`).classList.add('active');
  document.getElementById('offers-idle').classList.add('hidden');
  current = num;

  const data = offers[num];
  panel.classList.remove('visible');

  requestAnimationFrame(() => {
    document.getElementById('panel-text').textContent = data.text;

    const chipsEl = document.getElementById('panel-chips');
    if (data.chips) {
      chipsEl.style.display = '';
      chipsEl.innerHTML = data.chips.map(c =>
        `<a href="levels.html" class="level-chip" style="background:${c.bg};color:${c.color};border-color:${c.border}">${c.label}</a>`
      ).join('');
    } else {
      chipsEl.style.display = 'none';
    }

    const link = document.getElementById('panel-link');
    link.href = data.href;
    link.style.color = data.lc;
    link.style.borderColor = data.lc;
    link.onmouseenter = () => { link.style.background = data.lc; link.style.color = '#fff'; };
    link.onmouseleave = () => { link.style.background = 'transparent'; link.style.color = data.lc; };

    panel.classList.add('visible');
  });
}

function toggleNavDot() {
  document.getElementById('nav-menu').classList.toggle('open');
}
document.addEventListener('click', function(e) {
  const dot = document.getElementById('nav-dot');
  if (dot && !dot.contains(e.target)) document.getElementById('nav-menu').classList.remove('open');
});
</script>
</body>
</html>
