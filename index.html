<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Capable AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  /* ── LANDING ── */
  #landing {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    position: relative;
    background:
      linear-gradient(rgba(226,232,240,0.5) 1px, transparent 1px),
      linear-gradient(90deg, rgba(226,232,240,0.5) 1px, transparent 1px),
      #ffffff;
    background-size: 48px 48px, 48px 48px, auto;
    overflow: hidden;
  }

  .landing-cluster {
    width: 100%;
    max-width: 620px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .brand-lockup {
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-align: center;
  }

  .brand-name {
    font-size: clamp(36px, 5vw, 52px);
    font-weight: 600;
    letter-spacing: -0.025em;
    line-height: 1.1;
    color: #0f0e0c;
  }

  .brand-name .brand-accent {
    display: inline-block;
    background: linear-gradient(135deg, #93c5fd 0%, #60a5fa 28%, #2563eb 62%, #1d4ed8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .brand-tagline {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: #9a9080;
    letter-spacing: 0.08em;
    line-height: 1.4;
    text-transform: uppercase;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .search-area { width: 100%; }

  .input-rail {
    width: 100%;
    display: grid;
    grid-template-columns: 44px 1fr 36px 44px;
    align-items: center;
    background: #ffffff;
    border: 1px solid rgba(0,0,0,0.09);
    border-radius: 999px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07), 0 1px 3px rgba(0,0,0,0.04);
    min-height: 58px;
    padding: 0 8px 0 4px;
    gap: 0;
    transition: box-shadow 0.2s ease, border-color 0.2s ease;
    cursor: pointer;
  }
  .input-rail:hover {
    box-shadow: 0 4px 20px rgba(0,0,0,0.11), 0 1px 4px rgba(0,0,0,0.05);
    border-color: rgba(0,0,0,0.15);
  }

  .rail-icon-btn {
    background: none;
    border: none;
    color: #999;
    font-size: 18px;
    font-weight: 300;
    line-height: 1;
    cursor: pointer;
    padding: 0;
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    font-family: inherit;
    transition: color 0.15s;
  }
  .rail-icon-btn:hover { color: #0f0e0c; }

  .rail-body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 300;
    font-size: clamp(15px, 1.5vw, 17px);
    color: #444;
    padding: 4px 6px;
    line-height: 1.5;
  }

  .p-cursor {
    display: inline-block;
    width: 1.5px;
    height: 1em;
    background: #c8b090;
    margin-left: 1px;
    vertical-align: middle;
    animation: blink 0.9s step-end infinite;
  }

  .submit-btn {
    width: 36px;
    height: 36px;
    background: #0f0e0c;
    border: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, transform 0.15s;
    flex-shrink: 0;
    margin-right: 2px;
  }
  .submit-btn:hover { background: #333; transform: scale(1.06); }
  .submit-btn svg { width: 14px; height: 14px; }
</style>
</head>
<body>

<div id="landing">
  <div class="landing-cluster">
    <div class="brand-lockup">
      <div class="brand-name">Capable <span class="brand-accent">AI</span></div>
      <div class="brand-tagline">We help your team actually use AI.</div>
    </div>
    <div class="search-area">
      <div class="input-rail" onclick="goToOffers()">
        <button class="rail-icon-btn" type="button" aria-label="Add" onclick="goToOffers()">+</button>
        <div class="rail-body">
          <span id="typed-prompt"></span><span class="p-cursor"></span>
        </div>
        <button class="rail-icon-btn" type="button" aria-label="Voice" onclick="goToOffers()">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path d="M12 14a3 3 0 0 0 3-3V7a3 3 0 1 0-6 0v4a3 3 0 0 0 3 3zm5-3a1 1 0 1 1 2 0 7 7 0 0 1-6 6.92V20h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-2.08A7 7 0 0 1 5 11a1 1 0 1 1 2 0 5 5 0 0 0 10 0z" fill="currentColor"/>
          </svg>
        </button>
        <button class="submit-btn" type="button" onclick="goToOffers()" aria-label="See our offers">
          <svg viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="13" x2="8" y2="3"/>
            <polyline points="4,7 8,3 12,7"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="site-nav" id="site-nav">
  <button class="site-nav-btn" type="button" onclick="toggleSiteNav()" aria-label="Open menu" aria-expanded="false">Menu</button>
  <div class="site-nav-backdrop" onclick="closeSiteNav()"></div>
  <div class="site-nav-panel" role="dialog" aria-label="Site navigation">
    <a href="index.html" class="site-nav-brand">Capable <span class="site-nav-brand-accent">AI</span></a>
    <div class="site-nav-group">
      <a href="levels.html" class="site-nav-link">AI Levels</a>
    </div>
    <div class="site-nav-group">
      <a href="offers.html" class="site-nav-link">Offers</a>
      <div class="site-nav-sub">
        <a href="executive-essentials.html" class="site-nav-sublink">AI Executive Essentials</a>
        <a href="basic-training.html" class="site-nav-sublink">AI Basic Training</a>
        <a href="advanced-training.html" class="site-nav-sublink">AI Advanced Training</a>
        <a href="assessment.html" class="site-nav-sublink">AI Opportunity Assessment</a>
      </div>
    </div>
    <div class="site-nav-group">
      <span class="site-nav-label">Company</span>
      <div class="site-nav-sub">
        <a href="about.html" class="site-nav-sublink">About</a>
        <a href="contact.html" class="site-nav-sublink">Contact</a>
        <a href="privacy.html" class="site-nav-sublink">Privacy</a>
      </div>
    </div>
  </div>
</div>

<script>
  function typewriter(el, texts, { typeMs = 65, deleteMs = 35, pauseMs = 2200, pauseEmptyMs = 400 } = {}) {
    let idx = 0, pos = 0, deleting = false;
    function tick() {
      const full = texts[idx];
      if (!deleting) {
        pos++;
        el.textContent = full.slice(0, pos);
        if (pos === full.length) { deleting = true; setTimeout(tick, pauseMs); return; }
        setTimeout(tick, typeMs);
      } else {
        pos--;
        el.textContent = full.slice(0, pos);
        if (pos === 0) { deleting = false; idx = (idx + 1) % texts.length; setTimeout(tick, pauseEmptyMs); return; }
        setTimeout(tick, deleteMs);
      }
    }
    tick();
  }

  const searchPrompts = [
    "How can I build this presentation faster?",
    "Can you summarise these client notes?",
    "Write a follow-up email for this deal.",
    "Turn this meeting into action items.",
    "Research this company for me.",
    "Help me respond to this difficult email.",
    "Build a proposal from these notes.",
    "What should I prioritise this week?",
    "Draft a job description for this role.",
    "Rewrite this pitch in plain English.",
  ];

  typewriter(document.getElementById('typed-prompt'), searchPrompts, { typeMs: 52, deleteMs: 22, pauseMs: 1900, pauseEmptyMs: 300 });

  function goToOffers() { window.location.href = 'levels.html'; }

  function toggleSiteNav() {
    const nav = document.getElementById('site-nav');
    const btn = nav.querySelector('.site-nav-btn');
    const open = nav.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  function closeSiteNav() {
    const nav = document.getElementById('site-nav');
    const btn = nav.querySelector('.site-nav-btn');
    nav.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
  }
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeSiteNav();
  });
</script>

</body>
</html>
