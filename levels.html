<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Levels — Capable AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>

/* ── LAYOUT ── */
.levels-outer {
  display: grid;
  grid-template-columns: 300px 1fr;
  min-height: calc(100vh - 60px);
  max-width: 1060px;
  margin: 0 auto;
}

/* ── LEFT COLUMN ── */
.levels-left {
  padding: 56px 32px 56px 40px;
  border-right: 1px solid #e8edf2;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.levels-eyebrow {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: #5a5248;
  font-weight: 500;
  margin-bottom: 20px;
}

/* ── LEVEL BLOCK ── */
[data-level="0"] { --lc: #93c5fd; }
[data-level="1"] { --lc: #60a5fa; }
[data-level="2"] { --lc: #3b82f6; }
[data-level="3"] { --lc: #2563eb; }
[data-level="4"] { --lc: #1d4ed8; }
[data-level="5"] { --lc: #1e3a8a; }

.level-block {
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 3px;
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 16px;
  cursor: pointer;
  user-select: none;
  box-shadow: 6px 6px 0 var(--lc);
  transition: transform 0.18s ease, box-shadow 0.18s ease,
              background 0.2s ease, border-color 0.18s ease;
}
.level-block:hover {
  border-color: var(--lc);
  transform: translate(-2px, -2px);
  box-shadow: 8px 8px 0 var(--lc);
}
.level-block.active {
  background: var(--lc);
  border-color: transparent;
  transform: translate(-2px, -2px);
  box-shadow: 8px 8px 0 rgba(0,0,0,0.18);
}

.lb-num {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.04em;
  color: var(--lc);
  min-width: 32px;
  line-height: 1;
  transition: color 0.2s;
}
.level-block.active .lb-num { color: rgba(255,255,255,0.65); }

.lb-name {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: #0f0e0c;
  transition: color 0.2s;
}
.level-block.active .lb-name { color: #fff; }

/* ── RIGHT PANEL ── */
.levels-right {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 56px 56px;
  position: relative;
}

.panel-idle {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  transition: opacity 0.2s;
}
.panel-idle-arrow {
  font-size: 20px;
  color: #9a9080;
  transform: rotate(180deg);
  display: inline-block;
}
.panel-idle-text {
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #9a9080;
}
.panel-idle.hidden { opacity: 0; pointer-events: none; }

.level-panel {
  display: none;
  width: 100%;
  max-width: 420px;
}
.level-panel.visible {
  display: block;
  animation: panelIn 0.28s ease;
}
@keyframes panelIn {
  from { opacity: 0; transform: translateX(20px); }
  to   { opacity: 1; transform: translateX(0); }
}

.panel-inner {
  background: #f5f7fa;
  border: 1px solid #e8edf2;
  border-radius: 8px;
  padding: 48px 40px 44px;
  text-align: center;
}

.panel-icon {
  width: 64px;
  height: 64px;
  margin: 0 auto 28px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.panel-icon svg {
  width: 100%;
  height: 100%;
}

.panel-level-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  font-weight: 500;
  color: var(--panel-lc, #3b82f6);
  margin-bottom: 8px;
}
.panel-name {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.025em;
  color: #0f0e0c;
  margin-bottom: 18px;
}
.panel-detail {
  font-size: 14px;
  font-weight: 300;
  color: #5a5248;
  line-height: 1.78;
  text-align: left;
}

/* bottom link */
.levels-footer-link {
  padding: 24px 40px;
  border-top: 1px solid #e8edf2;
  max-width: 1060px;
  margin: 0 auto;
}
.levels-footer-link a {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #bbb;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: color 0.2s;
}
.levels-footer-link a:hover { color: #0f0e0c; }
.lf-arrow { display: inline-block; transition: transform 0.2s; }
.levels-footer-link a:hover .lf-arrow { transform: translateX(4px); }

/* ── PANEL COPY ── */
.panel-hook {
  font-size: 14px;
  font-weight: 400;
  color: #0f0e0c;
  line-height: 1.55;
  margin-bottom: 16px;
  text-align: center;
}
.panel-bullets {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.panel-bullets li {
  font-size: 12px;
  font-weight: 300;
  color: #5a5248;
  line-height: 1.6;
  padding-left: 14px;
  position: relative;
}
.panel-bullets li::before {
  content: '';
  position: absolute;
  left: 1px;
  top: 7px;
  width: 5px;
  height: 5px;
  background: #3b82f6;
  border-radius: 50%;
}

/* ── OFFER PILL ── */
.panel-offer {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid #e8edf2;
  display: flex;
  justify-content: center;
}
.panel-offer-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1.5px solid #3b82f6;
  color: #3b82f6;
  background: transparent;
  text-decoration: none;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  padding: 8px 20px;
  border-radius: 999px;
  transition: background 0.18s, color 0.18s;
}
.panel-offer-pill:hover {
  background: #3b82f6;
  color: #fff;
}

/* ── MOBILE ── */
@media (max-width: 768px) {
  .levels-outer { grid-template-columns: 1fr; }
  .levels-left { padding: 40px 20px; border-right: none; border-bottom: 1px solid #e8edf2; }
  .levels-right { padding: 40px 20px; }
  .panel-idle { display: none; }
  .level-panel { max-width: 100%; }
}
</style>
</head>
<body>


<div class="levels-outer">

  <!-- LEFT: blocks -->
  <div class="levels-left">
    <div class="levels-eyebrow">AI Maturity · 0 → 5</div>

    <div class="level-block" data-level="0" onclick="selectLevel(0)">
      <div class="lb-num">0</div>
      <div class="lb-name">Passenger</div>
    </div>
    <div class="level-block" data-level="1" onclick="selectLevel(1)">
      <div class="lb-num">1</div>
      <div class="lb-name">Driver</div>
    </div>
    <div class="level-block" data-level="2" onclick="selectLevel(2)">
      <div class="lb-num">2</div>
      <div class="lb-name">Builder</div>
    </div>
    <div class="level-block" data-level="3" onclick="selectLevel(3)">
      <div class="lb-num">3</div>
      <div class="lb-name">Connector</div>
    </div>
    <div class="level-block" data-level="4" onclick="selectLevel(4)">
      <div class="lb-num">4</div>
      <div class="lb-name">Architect</div>
    </div>
    <div class="level-block" data-level="5" onclick="selectLevel(5)">
      <div class="lb-num">5</div>
      <div class="lb-name">Orchestrator</div>
    </div>
  </div>

  <!-- RIGHT: panel -->
  <div class="levels-right">

    <div class="panel-idle" id="panel-idle">
      <span class="panel-idle-arrow">→</span>
      <span class="panel-idle-text">Select a level</span>
    </div>

    <div class="level-panel" id="level-panel">
      <div class="panel-inner">
        <div class="panel-icon" id="panel-icon"></div>
        <div class="panel-level-label" id="panel-label"></div>
        <div class="panel-name" id="panel-name"></div>
        <div class="panel-detail" id="panel-detail"></div>
        <div class="panel-offer">
          <a id="panel-offer-link" class="panel-offer-pill" href="#"></a>
        </div>
      </div>
    </div>

  </div>

</div>

<div class="levels-footer-link">
  <a href="offers.html">See how we move your team up the levels <span class="lf-arrow">→</span></a>
</div>

<script>
const levels = {
  0: {

    label: 'Level 0',
    lc: '#93c5fd',
    offer: { href: 'basic-training.html', label: 'AI Basic Training →' },
    hook: "Where most teams are after six months of paying for an enterprise plan.",
    bullets: [
      "Has access to the tool but doesn't use it as part of how they work",
      "Can't get useful output reliably",
      "Doesn't know what the tool is actually capable of"
    ],
    icon: `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="24" cy="24" r="18" stroke="currentColor" stroke-width="2.5"/>
    </svg>`
  },
  1: {
    name: 'Driver',
    label: 'Level 1',
    lc: '#60a5fa',
    offer: { href: 'basic-training.html', label: 'AI Basic Training →' },
    hook: "Getting useful outputs regularly and starting to understand why.",
    bullets: [
      "Writes clear prompts that include who they are, what they want, and the context behind it",
      "Iterates on bad outputs instead of giving up",
      "Uses AI for first drafts, summaries, and brainstorming on real work"
    ],
    icon: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
      <line x1="6" y1="24" x2="42" y2="24"/>
      <polyline points="30,12 42,24 30,36"/>
    </svg>`
  },
  2: {
    name: 'Builder',
    label: 'Level 2',
    lc: '#3b82f6',
    offer: { href: 'basic-training.html', label: 'AI Basic Training →' },
    hook: "Using AI in a way that's repeatable, not just occasional.",
    bullets: [
      "Sets up workspaces with saved instructions, examples, and reference documents",
      "Brings the right context every time: files, examples, constraints",
      "Produces consistent results on the same task without rewriting the prompt each time"
    ],
    icon: `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
      <rect x="6" y="32" width="36" height="6" rx="1.5" fill="currentColor"/>
      <rect x="6" y="22" width="28" height="6" rx="1.5" fill="currentColor" opacity="0.65"/>
      <rect x="6" y="12" width="20" height="6" rx="1.5" fill="currentColor" opacity="0.35"/>
    </svg>`
  },
  3: {
    name: 'Connector',
    label: 'Level 3',
    lc: '#2563eb',
    offer: { href: 'advanced-training.html', label: 'AI Advanced Training →' },
    hook: "Starting to think about where AI fits in the broader stack, not just what it can produce on its own.",
    bullets: [
      "Connects AI to other tools like CRMs, document libraries, or search",
      "Builds custom skills that handle repeatable work end-to-end",
      "Thinks about what goes in and what comes out, not just the prompt in the middle"
    ],
    icon: `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="8" cy="24" r="5" fill="currentColor"/>
      <circle cx="40" cy="24" r="5" fill="currentColor"/>
      <circle cx="24" cy="24" r="4" fill="currentColor" opacity="0.5"/>
      <line x1="13" y1="24" x2="20" y2="24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="28" y1="24" x2="35" y2="24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </svg>`
  },
  4: {
    name: 'Architect',
    label: 'Level 4',
    lc: '#1d4ed8',
    offer: { href: 'advanced-training.html', label: 'AI Advanced Training →' },
    hook: "Building AI workflows that other people can run, not just use themselves.",
    bullets: [
      "Maps the full process: what starts it, what data it needs, who checks it, where it goes",
      "Defines ownership, quality checks, and what failure looks like",
      "Builds workflows the team can use without the person who built them"
    ],
    icon: `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="24" y1="6" x2="24" y2="42" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
      <line x1="6" y1="24" x2="42" y2="24" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
      <path d="M24 10 L38 24 L24 38 L10 24 Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="24" cy="24" r="3.5" fill="currentColor"/>
    </svg>`
  },
  5: {
    name: 'Orchestrator',
    label: 'Level 5',
    lc: '#1e3a8a',
    offer: { href: 'advanced-training.html', label: 'AI Advanced Training →' },
    hook: "Actively making the people around them better at this, not just getting better themselves.",
    bullets: [
      "Coaches peers through their own AI work without taking over",
      "Reviews existing workflows to catch quality decline before it spreads",
      "Spots when new AI capabilities matter for the business and when they don't"
    ],
    icon: `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="24" cy="24" r="5" fill="currentColor"/>
      <circle cx="24" cy="7" r="3" fill="currentColor" opacity="0.5"/>
      <circle cx="39" cy="15.5" r="3" fill="currentColor" opacity="0.5"/>
      <circle cx="39" cy="32.5" r="3" fill="currentColor" opacity="0.5"/>
      <circle cx="24" cy="41" r="3" fill="currentColor" opacity="0.5"/>
      <circle cx="9" cy="24" r="3" fill="currentColor" opacity="0.5"/>
      <line x1="24" y1="19" x2="24" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
      <line x1="28.6" y1="21.4" x2="36.3" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
      <line x1="28.6" y1="26.6" x2="36.3" y2="31" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
      <line x1="24" y1="29" x2="24" y2="38" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
      <line x1="19" y1="24" x2="12" y2="24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    </svg>`
  }
};

function selectLevel(num) {
  const data = levels[num];

  // update blocks
  document.querySelectorAll('.level-block').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-level="${num}"]`).classList.add('active');

  // update panel
  const panel      = document.getElementById('level-panel');
  const idle       = document.getElementById('panel-idle');
  const icon       = document.getElementById('panel-icon');
  const label      = document.getElementById('panel-label');
  const name       = document.getElementById('panel-name');
  const detail     = document.getElementById('panel-detail');
  const panelInner = document.querySelector('.panel-inner');

  // fade out, swap, fade in
  panel.style.opacity = '0';
  panel.style.transition = 'opacity 0.15s';

  setTimeout(() => {
    icon.innerHTML   = data.icon;
    icon.style.color = data.lc;
    label.textContent = data.label;
    label.style.setProperty('--panel-lc', data.lc);
    label.style.color = data.lc;
    name.textContent  = data.name;
    detail.innerHTML = `<p class="panel-hook">${data.hook}</p><ul class="panel-bullets">${data.bullets.map(b => `<li>${b}</li>`).join('')}</ul>`;

    const offerLink = document.getElementById('panel-offer-link');
    offerLink.textContent = data.offer.label;
    offerLink.href = data.offer.href;
    offerLink.style.borderColor = data.lc;
    offerLink.style.color = data.lc;
    offerLink.onmouseenter = () => { offerLink.style.background = data.lc; offerLink.style.color = '#fff'; };
    offerLink.onmouseleave = () => { offerLink.style.background = 'transparent'; offerLink.style.color = data.lc; };

    idle.classList.add('hidden');
    panel.classList.add('visible');
    panel.style.opacity = '1';
    panel.style.animation = 'panelIn 0.28s ease';

    // reset animation
    void panel.offsetWidth;
  }, 150);
}
</script>

<div class="site-nav" id="site-nav">
  <button class="site-nav-btn" type="button" onclick="toggleSiteNav()" aria-label="Open menu" aria-expanded="false">Menu</button>
  <div class="site-nav-backdrop" onclick="closeSiteNav()"></div>
  <div class="site-nav-panel" role="dialog" aria-label="Site navigation">
    <a href="index.html" class="site-nav-brand">Capable <span class="site-nav-brand-accent">AI</span></a>
    <div class="site-nav-group">
      <a href="levels.html" class="site-nav-link">AI Levels</a>

    <div class="site-nav-group">
      <a href="offers.html" class="site-nav-link">Offers</a>
      <div class="site-nav-sub">
        <a href="basic-training.html" class="site-nav-sublink">AI Basic Training</a>
        <a href="advanced-training.html" class="site-nav-sublink">AI Advanced Training</a>
        <a href="assessment.html" class="site-nav-sublink">AI Opportunity Assessment</a>
      </div>
    </div>
    <div class="site-nav-group">
      <span class="site-nav-label">Company</span>
      <div class="site-nav-sub">

        <a href="contact.html" class="site-nav-sublink">Contact</a>
        <a href="privacy.html" class="site-nav-sublink">Privacy</a>
      </div>
    </div>
  </div>
</div>
<script>
function toggleSiteNav() {
  const nav = document.getElementById('site-nav');
  const btn = nav.querySelector('.site-nav-btn');
  const open = nav.classList.toggle('open');
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}
function closeSiteNav() {
  const nav = document.getElementById('site-nav');
  const btn = nav.querySelector('.site-nav-btn');
  nav.classList.remove('open');
  btn.setAttribute('aria-expanded', 'false');
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeSiteNav();
});
</script>
</body>
</html>
