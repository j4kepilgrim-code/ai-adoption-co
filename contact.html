<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact — Capable AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>

.contact-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 80px 40px;
}

.contact-card {
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 48px 52px;
  max-width: 480px;
  width: 100%;
  box-shadow: 8px 8px 0 #2563eb;
  display: flex;
  flex-direction: column;
  gap: 24px;
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}
.contact-card:hover {
  transform: translate(-2px, -2px);
  box-shadow: 10px 10px 0 #2563eb;
  cursor: pointer;
}

.contact-email {
  font-family: 'Inter', sans-serif;
  font-size: clamp(20px, 3.5vw, 26px);
  font-weight: 600;
  letter-spacing: -0.025em;
  color: #0e0c0a;
  display: block;
  transition: color 0.15s;
}
.contact-card:hover .contact-email { color: #2563eb; }

.contact-divider {
  border: none;
  border-top: 1px solid #e8edf2;
  margin: 0;
}

.contact-note {
  font-size: 13px;
  font-weight: 300;
  color: #9a9080;
  line-height: 1.75;
}

@media (max-width: 600px) {
  .contact-page { padding: 60px 24px; }
  .contact-card { padding: 36px 32px; }
}

</style>
</head>
<body>

<div class="contact-page">
  <div class="contact-card" onclick="copyEmail()" role="button" tabindex="0" aria-label="Copy email address">
    <span class="contact-email" id="contact-email-text">hello@capableai.io</span>
    <hr class="contact-divider">
    <p class="contact-note">Let's get your team actually using AI.</p>
  </div>
</div>

<script>
function copyEmail() {
  navigator.clipboard.writeText('hello@capableai.io').then(() => {
    const el = document.getElementById('contact-email-text');
    el.textContent = 'Copied ✓';
    setTimeout(() => { el.textContent = 'hello@capableai.io'; }, 2000);
  });
}
</script>

<div class="site-nav" id="site-nav">
  <button class="site-nav-btn" type="button" onclick="toggleSiteNav()" aria-label="Open menu" aria-expanded="false">Menu</button>
  <div class="site-nav-backdrop" onclick="closeSiteNav()"></div>
  <div class="site-nav-panel" role="dialog" aria-label="Site navigation">
    <a href="index.html" class="site-nav-brand">Capable <span class="site-nav-brand-accent">AI</span></a>
    <div class="site-nav-group">
      <a href="levels.html" class="site-nav-link">AI Levels</a>
    </div>
    <div class="site-nav-group">
      <a href="offers.html" class="site-nav-link">Offers</a>
      <div class="site-nav-sub">
        <a href="executive-essentials.html" class="site-nav-sublink">AI Executive Essentials</a>
        <a href="basic-training.html" class="site-nav-sublink">AI Basic Training</a>
        <a href="advanced-training.html" class="site-nav-sublink">AI Advanced Training</a>
        <a href="assessment.html" class="site-nav-sublink">AI Opportunity Assessment</a>
      </div>
    </div>
    <div class="site-nav-group">
      <span class="site-nav-label">Company</span>
      <div class="site-nav-sub">
        <a href="about.html" class="site-nav-sublink">About</a>
        <a href="contact.html" class="site-nav-sublink">Contact</a>
        <a href="privacy.html" class="site-nav-sublink">Privacy</a>
      </div>
    </div>
  </div>
</div>
<script>
function toggleSiteNav() {
  const nav = document.getElementById('site-nav');
  const btn = nav.querySelector('.site-nav-btn');
  const open = nav.classList.toggle('open');
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}
function closeSiteNav() {
  const nav = document.getElementById('site-nav');
  const btn = nav.querySelector('.site-nav-btn');
  nav.classList.remove('open');
  btn.setAttribute('aria-expanded', 'false');
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeSiteNav();
});
</script>
</body>
</html>
